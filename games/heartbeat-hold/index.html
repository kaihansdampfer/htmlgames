<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Heartbeat Hold</title>
<style>
:root{color-scheme:dark;--bg:#05070f;--panel:rgba(14,18,30,.9);--accent:#f86b6b;--text:#e6f3ff;--muted:rgba(230,243,255,.65)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 20%,rgba(248,107,107,.2),transparent 40%),radial-gradient(circle at 80% 10%,rgba(255,183,108,.12),transparent 45%),var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",sans-serif}
.shell{width:min(94vw,900px);display:grid;gap:14px;padding:18px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center}
.panel{background:var(--panel);border:1px solid rgba(248,107,107,.25);border-radius:14px;padding:14px}
.stats{display:grid;grid-auto-flow:column;gap:10px}
.stat{min-width:120px;text-align:center}
.stat span{display:block;font-size:.7rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.stat strong{font-size:1.3rem}
.canvas{background:#03040a;border:1px solid rgba(248,107,107,.2);border-radius:12px}
.meter{display:grid;gap:6px}
.bar{height:14px;border-radius:999px;border:1px solid rgba(248,107,107,.2);background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.fill{position:absolute;inset:0;width:50%;background:linear-gradient(90deg,#f86b6b,#ffb76c)}
.band{position:absolute;inset:0;margin-left:48%;width:24%;border:1px dashed rgba(255,255,255,.5);background:rgba(108,245,255,.18)}
.hold{background:#101522;border:1px solid rgba(248,107,107,.4);border-radius:12px;padding:10px 14px;text-align:center;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,4,12,.78);opacity:0;pointer-events:none;transition:opacity .2s ease;border-radius:14px}
.overlay.show{opacity:1;pointer-events:auto}
button{margin-top:10px;padding:10px 16px;border-radius:999px;border:none;background:var(--accent);color:#1c0505;font-weight:700;cursor:pointer}
.controls{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted)}
.link{color:var(--accent);text-decoration:none}
.highscores ol{margin:0;padding-left:20px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>Heartbeat Hold</h1>
      <div class="muted">Hold to raise, release to breathe. Stay in the band.</div>
    </div>
    <div class="panel stats">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Best</span><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="panel" style="position:relative;display:grid;gap:12px">
    <canvas id="scope" width="860" height="220" class="canvas" aria-label="Heartbeat monitor"></canvas>
    <div class="meter">
      <div>Pulse stability</div>
      <div class="bar"><div class="band"></div><div class="fill" id="pulse"></div></div>
    </div>
    <div class="hold" id="hold">Hold or Space</div>
    <div class="overlay show" id="overlay">
      <div class="panel">
        <h2 id="ot">Stabilize the patient</h2>
        <p id="otx" style="color:var(--muted)">Keep the pulse inside the band.</p>
        <button id="start">Start</button>
      </div>
    </div>
  </div>

  <div class="panel controls">
    <span>Hold to increase, release to decrease</span>
    <span><a class="link" href="../../index.html">Back to games list</a></span>
  </div>

  <div class="panel highscores">
    <h3>Top Scores</h3>
    <ol id="scores"></ol>
  </div>
</div>

<script src="../../libs/core.js"></script>
<script src="../../libs/prefs.js"></script>
<script src="../../libs/themes.js"></script>
<script src="../../libs/debug.js"></script>
<script src="../../libs/highscores.js"></script>
<script src="../../libs/ui.js"></script>
<script>
const gameId="heartbeat-hold";
const c=document.getElementById("scope");
const g=c.getContext("2d");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const pulseEl=document.getElementById("pulse");
const list=document.getElementById("scores");
const overlay=document.getElementById("overlay");
const ot=document.getElementById("ot");
const otx=document.getElementById("otx");
const start=document.getElementById("start");
const hold=document.getElementById("hold");
const s={run:false,press:false,t:0,score:0,best:0,p:56,safe:0,fail:0,trace:[],last:0};
const band={lo:48,hi:72};
HTMLGAMES.themes.applyTheme(HTMLGAMES.themes.getTheme());
function hs(){const r=HTMLGAMES.highscores.top(gameId,5);list.innerHTML="";if(!r.length){const li=document.createElement("li");li.textContent="No scores yet.";list.appendChild(li);}else{r.forEach(e=>{const li=document.createElement("li");li.textContent=`${e.score} pts`;list.appendChild(li);});}s.best=r.length?r[0].score:0;bestEl.textContent=s.best;}
function reset(){s.t=0;s.score=0;s.safe=0;s.fail=0;s.p=56;s.trace=new Array(160).fill(s.p);scoreEl.textContent=0;pulseEl.style.width=s.p+"%";}
function upd(dt){s.t+=dt;const drift=Math.sin(s.t*2.1)*.4;const d=(s.press?30:-24)*dt;s.p=Math.max(2,Math.min(98,s.p+d+drift));const ok=s.p>=band.lo&&s.p<=band.hi;if(ok){s.safe+=dt;s.fail=Math.max(0,s.fail-dt*.6);}else{s.fail+=dt;}if(s.p<8||s.p>92)s.fail+=dt*.8;s.score=Math.floor(s.safe*10);scoreEl.textContent=s.score;pulseEl.style.width=s.p+"%";s.trace.push(s.p);if(s.trace.length>160)s.trace.shift();if(s.fail>=2.5)end("Flatline risk",`Final score: ${s.score}`);}
function draw(){g.fillStyle="#03050b";g.fillRect(0,0,c.width,c.height);const top=c.height*(1-band.hi/100);const bot=c.height*(1-band.lo/100);g.fillStyle="rgba(108,245,255,.12)";g.fillRect(0,top,c.width,bot-top);g.strokeStyle="rgba(248,107,107,.8)";g.lineWidth=2;g.beginPath();s.trace.forEach((v,i)=>{const x=i/(s.trace.length-1)*c.width;const y=c.height*(1-v/100);if(i===0)g.moveTo(x,y);else g.lineTo(x,y);});g.stroke();g.fillStyle="rgba(255,255,255,.7)";g.font="12px 'Trebuchet MS',sans-serif";g.fillText(`Pulse: ${Math.round(s.p)}`,12,18);}
function loop(ts){if(!s.run)return;const dt=Math.min(.05,(ts-s.last)/1000||.016);s.last=ts;upd(dt);draw();requestAnimationFrame(loop);}
function startGame(){reset();overlay.classList.remove("show");s.run=true;s.last=performance.now();requestAnimationFrame(loop);}
function end(title,text){s.run=false;ot.textContent=title;otx.textContent=text;overlay.classList.add("show");HTMLGAMES.highscores.submit(gameId,s.score);HTMLGAMES.debug.log("Game over",{score:s.score});hs();}
function setPress(v){s.press=v;hold.style.background=v?"rgba(248,107,107,.2)":"#101522";}
hold.addEventListener("pointerdown",e=>{e.preventDefault();setPress(true);});
["pointerup","pointerleave","pointercancel"].forEach(ev=>hold.addEventListener(ev,()=>setPress(false)));
window.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();setPress(true);}if(!s.run&&e.code==="Enter")startGame();});
window.addEventListener("keyup",e=>{if(e.code==="Space")setPress(false);});
start.addEventListener("click",startGame);
hs();draw();
</script>
</body>
</html>
