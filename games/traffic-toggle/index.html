<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Traffic Toggle</title>
<style>
:root{color-scheme:dark;--bg:#05070f;--panel:rgba(14,18,30,.9);--accent:#ffd166;--text:#e6f3ff;--muted:rgba(230,243,255,.65)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 15%,rgba(255,209,102,.2),transparent 45%),radial-gradient(circle at 85% 10%,rgba(108,245,255,.12),transparent 45%),var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",sans-serif}
.shell{width:min(94vw,900px);display:grid;gap:14px;padding:18px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center}
.panel{background:var(--panel);border:1px solid rgba(255,209,102,.25);border-radius:14px;padding:14px}
.stats{display:grid;grid-auto-flow:column;gap:10px}
.stat{min-width:120px;text-align:center}
.stat span{display:block;font-size:.7rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.stat strong{font-size:1.3rem}
.canvas{background:#070910;border:1px solid rgba(255,209,102,.2);border-radius:12px}
.signal{display:grid;grid-auto-flow:column;gap:8px;align-items:center;justify-content:center;margin-top:8px}
.light{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4)}
.light.on{background:var(--accent);box-shadow:0 0 10px rgba(255,209,102,.6)}
.toggle{background:#101522;border:1px solid rgba(255,209,102,.4);border-radius:12px;padding:10px 14px;text-align:center;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;margin-top:8px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,4,12,.78);opacity:0;pointer-events:none;transition:opacity .2s ease;border-radius:14px}
.overlay.show{opacity:1;pointer-events:auto}
button{margin-top:10px;padding:10px 16px;border-radius:999px;border:none;background:var(--accent);color:#2a1b05;font-weight:700;cursor:pointer}
.controls{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted)}
.link{color:var(--accent);text-decoration:none}
.highscores ol{margin:0;padding-left:20px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>Traffic Toggle</h1>
      <div class="muted">One button to keep the junction moving.</div>
    </div>
    <div class="panel stats">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Best</span><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="panel" style="position:relative;display:grid;gap:10px">
    <canvas id="game" width="860" height="360" class="canvas" aria-label="Traffic intersection"></canvas>
    <div class="signal">
      <span>NS</span><div class="light" id="ns"></div>
      <span>EW</span><div class="light" id="ew"></div>
    </div>
    <div class="toggle" id="toggle">Toggle (Space)</div>
    <div class="overlay show" id="overlay">
      <div class="panel">
        <h2 id="ot">Keep the flow</h2>
        <p id="otx" style="color:var(--muted)">Switch before queues exceed 3s.</p>
        <button id="start">Start</button>
      </div>
    </div>
  </div>

  <div class="panel controls">
    <span>Press Space or click to toggle</span>
    <span><a class="link" href="../../index.html">Back to games list</a></span>
  </div>

  <div class="panel highscores">
    <h3>Top Scores</h3>
    <ol id="scores"></ol>
  </div>
</div>

<script src="../../libs/core.js"></script>
<script src="../../libs/prefs.js"></script>
<script src="../../libs/themes.js"></script>
<script src="../../libs/debug.js"></script>
<script src="../../libs/highscores.js"></script>
<script src="../../libs/ui.js"></script>
<script>
const gameId="traffic-toggle";
const c=document.getElementById("game");
const g=c.getContext("2d");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const list=document.getElementById("scores");
const overlay=document.getElementById("overlay");
const ot=document.getElementById("ot");
const otx=document.getElementById("otx");
const start=document.getElementById("start");
const toggle=document.getElementById("toggle");
const ns=document.getElementById("ns");
const ew=document.getElementById("ew");
const s={run:false,t:0,score:0,best:0,light:"ns",cars:[],last:0};
HTMLGAMES.themes.applyTheme(HTMLGAMES.themes.getTheme());
function hs(){const r=HTMLGAMES.highscores.top(gameId,5);list.innerHTML="";if(!r.length){const li=document.createElement("li");li.textContent="No scores yet.";list.appendChild(li);}else{r.forEach(e=>{const li=document.createElement("li");li.textContent=`${e.score} cars`;list.appendChild(li);});}s.best=r.length?r[0].score:0;bestEl.textContent=s.best;}
function reset(){s.t=0;s.score=0;s.light="ns";s.cars=[];scoreEl.textContent=0;lights();}
function lights(){ns.classList.toggle("on",s.light==="ns");ew.classList.toggle("on",s.light==="ew");}
function spawn(dir){const now=s.t;const last=s.cars.filter(c=>c.d===dir).slice(-1)[0];if(last&&now-last.at<1.2)return;const speed=80+Math.random()*40;const lane=42;if(dir==="ns")s.cars.push({d:"ns",x:c.width/2-lane,y:-40,speed,wait:0,at:now});else s.cars.push({d:"ew",x:-40,y:c.height/2+lane,speed,wait:0,at:now});}
function update(dt){const stop=36,cx=c.width/2,cy=c.height/2;s.cars.forEach(car=>{const green=(car.d==="ns"&&s.light==="ns")||(car.d==="ew"&&s.light==="ew");if(car.d==="ns"){const sy=cy-stop;const ny=car.y+car.speed*dt;if(!green&&ny>=sy){car.wait+=dt;car.y=Math.min(car.y,sy-24);}else{car.y=ny;car.wait=0;}}else{const sx=cx-stop;const nx=car.x+car.speed*dt;if(!green&&nx>=sx){car.wait+=dt;car.x=Math.min(car.x,sx-24);}else{car.x=nx;car.wait=0;}}});if(s.cars.find(c=>c.wait>3))end("Traffic jam",`Score: ${s.score} cars`);s.cars=s.cars.filter(car=>{if(car.d==="ns"&&car.y>c.height+50){s.score+=1;return false;}if(car.d==="ew"&&car.x>c.width+50){s.score+=1;return false;}return true;});scoreEl.textContent=s.score;}
function drawRoad(){g.fillStyle="#0b0e1a";g.fillRect(0,0,c.width,c.height);g.fillStyle="#151a2a";g.fillRect(c.width/2-70,0,140,c.height);g.fillRect(0,c.height/2-70,c.width,140);g.strokeStyle="rgba(255,255,255,.25)";g.lineWidth=2;g.setLineDash([14,14]);g.beginPath();g.moveTo(c.width/2,0);g.lineTo(c.width/2,c.height);g.stroke();g.beginPath();g.moveTo(0,c.height/2);g.lineTo(c.width,c.height/2);g.stroke();g.setLineDash([]);}
function drawCars(){s.cars.forEach(car=>{g.fillStyle=car.d==="ns"?"#6cf5ff":"#ffd166";if(car.d==="ns")g.fillRect(car.x-12,car.y-24,24,48);else g.fillRect(car.x-24,car.y-12,48,24);});}
function draw(){drawRoad();drawCars();g.fillStyle="rgba(255,255,255,.75)";g.font="12px 'Trebuchet MS',sans-serif";g.fillText(`Light: ${s.light.toUpperCase()}`,12,18);}
function loop(ts){if(!s.run)return;const dt=Math.min(.05,(ts-s.last)/1000||.016);s.last=ts;s.t+=dt;if(Math.random()<.035)spawn("ns");if(Math.random()<.03)spawn("ew");update(dt);draw();requestAnimationFrame(loop);}
function startGame(){reset();overlay.classList.remove("show");s.run=true;s.last=performance.now();requestAnimationFrame(loop);}
function end(title,text){s.run=false;ot.textContent=title;otx.textContent=text;overlay.classList.add("show");HTMLGAMES.highscores.submit(gameId,s.score);HTMLGAMES.debug.log("Game over",{score:s.score});hs();}
function toggleLight(){if(!s.run)return;s.light=s.light==="ns"?"ew":"ns";lights();}
toggle.addEventListener("pointerdown",e=>{e.preventDefault();toggleLight();});
window.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();toggleLight();}if(!s.run&&e.code==="Enter")startGame();});
start.addEventListener("click",startGame);
hs();draw();
</script>
</body>
</html>
