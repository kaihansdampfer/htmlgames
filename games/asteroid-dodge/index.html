<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Asteroid Dodge</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070f;
      --panel: rgba(14, 18, 30, 0.9);
      --accent: #6cf5ff;
      --warn: #ff8f6c;
      --text: #e6f3ff;
      --muted: rgba(230, 243, 255, 0.65);
    }
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(108, 245, 255, 0.15), transparent 45%),
        radial-gradient(circle at 80% 10%, rgba(255, 143, 108, 0.12), transparent 40%),
        var(--bg);
      color: var(--text);
    }
    .shell {
      width: min(96vw, 980px);
      display: grid;
      gap: 16px;
      padding: 20px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2.8vw, 2.4rem);
      letter-spacing: 0.04em;
    }
    .stats {
      display: grid;
      grid-auto-flow: column;
      gap: 12px;
    }
    .stat {
      background: var(--panel);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(108, 245, 255, 0.3);
      min-width: 130px;
      text-align: center;
    }
    .stat span {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--muted);
    }
    .stat strong {
      font-size: 1.3rem;
    }
    .arena {
      position: relative;
      background: #02030a;
      border-radius: 18px;
      border: 1px solid rgba(108, 245, 255, 0.2);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(2, 4, 12, 0.78);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      text-align: center;
      padding: 20px;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 24px 28px;
      border: 1px solid rgba(108, 245, 255, 0.25);
      max-width: 360px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .panel h2 {
      margin-top: 0;
    }
    .panel p {
      margin: 12px 0;
      color: var(--muted);
    }
    button {
      margin-top: 12px;
      padding: 10px 18px;
      background: var(--accent);
      color: #031018;
      font-weight: 700;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(108, 245, 255, 0.25);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(108, 245, 255, 0.2);
    }
    .controls span {
      color: var(--muted);
    }
    .hint {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .link {
      color: var(--accent);
      text-decoration: none;
    }
    .highscores {
      background: var(--panel);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(108, 245, 255, 0.2);
    }
    .highscores h3 {
      margin: 0 0 8px;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .highscores ol {
      margin: 0;
      padding-left: 20px;
      color: var(--text);
    }
    .highscores li {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Asteroid Dodge</h1>
        <div class="hint">Pilot your pulse ship through incoming asteroid waves.</div>
      </div>
      <div class="stats">
        <div class="stat">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>Best</span>
          <strong id="best">0</strong>
        </div>
      </div>
    </header>

    <div class="arena">
      <canvas id="game" width="960" height="540" aria-label="Asteroid dodging game"></canvas>
      <div class="overlay show" id="overlay">
        <div class="panel">
          <h2 id="overlay-title">Ready for launch?</h2>
          <p id="overlay-text">Move with WASD or arrow keys. Hold space to dash through tight gaps.</p>
          <button id="start-btn">Start Run</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <span>Controls: <strong>WASD</strong> or <strong>Arrow keys</strong> to steer · <strong>Space</strong> to dash</span>
      <span class="hint">Built with HTML5 canvas · <a class="link" href="../../index.html">Back to games list</a></span>
    </div>

    <div class="highscores">
      <h3>Top Scores</h3>
      <ol id="highscore-list"></ol>
    </div>
  </div>

  <script src="../../libs/core.js"></script>
  <script src="../../libs/prefs.js"></script>
  <script src="../../libs/themes.js"></script>
  <script src="../../libs/debug.js"></script>
  <script src="../../libs/highscores.js"></script>
  <script src="../../libs/ui.js"></script>
  <script>
    const gameId = "asteroid-dodge";
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const highscoreList = document.getElementById("highscore-list");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayText = document.getElementById("overlay-text");
    const startBtn = document.getElementById("start-btn");

    const state = {
      running: false,
      time: 0,
      score: 0,
      best: 0,
      asteroids: [],
      stars: [],
      keys: new Set(),
      dashEnergy: 1,
      dashCooldown: 0,
      hitFlash: 0,
    };

    HTMLGAMES.themes.applyTheme(HTMLGAMES.themes.getTheme());

    function renderHighscores() {
      const scores = HTMLGAMES.highscores.top(gameId, 5);
      highscoreList.innerHTML = \"\";
      if (!scores.length) {
        const empty = document.createElement(\"li\");
        empty.textContent = \"No scores yet.\";
        highscoreList.appendChild(empty);
      } else {
        scores.forEach((entry) => {
          const item = document.createElement(\"li\");
          item.textContent = `${entry.score} pts`;
          highscoreList.appendChild(item);
        });
      }
      state.best = scores.length ? scores[0].score : 0;
      bestEl.textContent = state.best;
    }

    renderHighscores();

    const player = {
      x: canvas.width * 0.2,
      y: canvas.height * 0.5,
      vx: 0,
      vy: 0,
      radius: 16,
      speed: 0.4,
      dashSpeed: 7,
    };

    const spawnStar = () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.7 + 0.3,
    });

    for (let i = 0; i < 90; i += 1) {
      state.stars.push(spawnStar());
    }

    function resetGame() {
      state.time = 0;
      state.score = 0;
      state.asteroids = [];
      state.dashEnergy = 1;
      state.dashCooldown = 0;
      state.hitFlash = 0;
      player.x = canvas.width * 0.2;
      player.y = canvas.height * 0.5;
      player.vx = 0;
      player.vy = 0;
      scoreEl.textContent = state.score;
    }

    function spawnAsteroid() {
      const size = Math.random() * 26 + 18;
      const speed = Math.random() * 1.8 + 1.6 + Math.min(state.score / 40, 3);
      const y = Math.random() * (canvas.height - size * 2) + size;
      state.asteroids.push({
        x: canvas.width + size + Math.random() * 120,
        y,
        size,
        speed,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: Math.random() * 0.02 + 0.015,
      });
    }

    function updatePlayer(dt) {
      const accel = player.speed * dt;
      const maxSpeed = 4.2;
      let dx = 0;
      let dy = 0;
      if (state.keys.has("ArrowUp") || state.keys.has("w")) dy -= 1;
      if (state.keys.has("ArrowDown") || state.keys.has("s")) dy += 1;
      if (state.keys.has("ArrowLeft") || state.keys.has("a")) dx -= 1;
      if (state.keys.has("ArrowRight") || state.keys.has("d")) dx += 1;
      const length = Math.hypot(dx, dy) || 1;
      dx /= length;
      dy /= length;

      player.vx += dx * accel;
      player.vy += dy * accel;

      const damping = 0.9;
      player.vx *= damping;
      player.vy *= damping;

      player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));
      player.vy = Math.max(-maxSpeed, Math.min(maxSpeed, player.vy));

      if (state.keys.has(" ") && state.dashEnergy > 0.2 && state.dashCooldown <= 0) {
        player.vx += dx * player.dashSpeed;
        player.vy += dy * player.dashSpeed;
        state.dashEnergy = Math.max(0, state.dashEnergy - 0.35);
        state.dashCooldown = 12;
      }

      if (state.dashEnergy < 1) {
        state.dashEnergy = Math.min(1, state.dashEnergy + 0.004 * dt);
      }

      player.x += player.vx;
      player.y += player.vy;

      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      if (state.dashCooldown > 0) {
        state.dashCooldown -= 1;
      }
    }

    function updateAsteroids(dt) {
      if (state.time % 50 === 0) {
        spawnAsteroid();
      }
      state.asteroids.forEach((asteroid) => {
        asteroid.x -= asteroid.speed * dt;
        asteroid.y += Math.sin(state.time * asteroid.wobbleSpeed + asteroid.wobble) * 0.6;
      });
      state.asteroids = state.asteroids.filter((asteroid) => asteroid.x + asteroid.size > -30);
    }

    function updateStars(dt) {
      state.stars.forEach((star) => {
        star.x -= star.speed * dt;
        if (star.x < 0) {
          star.x = canvas.width + Math.random() * 40;
          star.y = Math.random() * canvas.height;
        }
      });
    }

    function checkCollisions() {
      for (const asteroid of state.asteroids) {
        const dist = Math.hypot(player.x - asteroid.x, player.y - asteroid.y);
        if (dist < player.radius + asteroid.size * 0.55) {
          return true;
        }
      }
      return false;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#060b1c";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(108, 245, 255, 0.35)";
      state.stars.forEach((star) => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      state.asteroids.forEach((asteroid) => {
        const gradient = ctx.createRadialGradient(
          asteroid.x - asteroid.size * 0.3,
          asteroid.y - asteroid.size * 0.3,
          asteroid.size * 0.2,
          asteroid.x,
          asteroid.y,
          asteroid.size
        );
        gradient.addColorStop(0, "#fef4c6");
        gradient.addColorStop(0.5, "#ffb06c");
        gradient.addColorStop(1, "#7b2c15");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(asteroid.x, asteroid.y, asteroid.size, 0, Math.PI * 2);
        ctx.fill();
      });

      if (state.hitFlash > 0) {
        ctx.fillStyle = "rgba(255, 100, 90, 0.35)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        state.hitFlash -= 1;
      }

      ctx.save();
      ctx.translate(player.x, player.y);
      const angle = Math.atan2(player.vy, player.vx);
      ctx.rotate(angle);
      ctx.fillStyle = "#6cf5ff";
      ctx.beginPath();
      ctx.moveTo(player.radius + 6, 0);
      ctx.lineTo(-player.radius, player.radius * 0.75);
      ctx.lineTo(-player.radius, -player.radius * 0.75);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      ctx.fillRect(18, 18, 140, 10);
      ctx.fillStyle = "#6cf5ff";
      ctx.fillRect(18, 18, 140 * state.dashEnergy, 10);
      ctx.fillStyle = "rgba(230, 243, 255, 0.75)";
      ctx.font = "12px 'Segoe UI', sans-serif";
      ctx.fillText("Dash Energy", 20, 40);
    }

    function loop() {
      if (!state.running) return;
      state.time += 1;
      updateStars(1);
      updatePlayer(1);
      updateAsteroids(1);
      const hit = checkCollisions();
      if (hit) {
        state.running = false;
        state.hitFlash = 18;
        overlayTitle.textContent = "Ship compromised!";
        overlayText.textContent = `Final score: ${state.score}. Tap start to try again.`;
        overlay.classList.add("show");
        HTMLGAMES.highscores.submit(gameId, state.score);
        renderHighscores();
        HTMLGAMES.debug.log("Game over", { score: state.score });
        render();
        return;
      }
      state.score = Math.floor(state.time / 5);
      scoreEl.textContent = state.score;
      render();
      requestAnimationFrame(loop);
    }

    function startGame() {
      resetGame();
      overlay.classList.remove("show");
      state.running = true;
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
        event.preventDefault();
      }
      state.keys.add(event.key);
      if (!state.running && event.key === "Enter") {
        startGame();
      }
    });

    window.addEventListener("keyup", (event) => {
      state.keys.delete(event.key);
    });

    startBtn.addEventListener("click", startGame);
  </script>
</body>
</html>
