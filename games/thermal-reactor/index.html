<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Thermal Reactor</title>
<style>
:root{color-scheme:dark;--bg:#05070f;--panel:rgba(14,18,30,.9);--accent:#ffb347;--text:#e6f3ff;--muted:rgba(230,243,255,.65)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 15%,rgba(255,179,71,.2),transparent 45%),radial-gradient(circle at 85% 10%,rgba(255,107,107,.12),transparent 45%),var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",sans-serif}
.shell{width:min(94vw,900px);display:grid;gap:14px;padding:18px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center}
.panel{background:var(--panel);border:1px solid rgba(255,179,71,.25);border-radius:14px;padding:14px}
.stats{display:grid;grid-auto-flow:column;gap:10px}
.stat{min-width:120px;text-align:center}
.stat span{display:block;font-size:.7rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.stat strong{font-size:1.3rem}
.canvas{background:#070910;border:1px solid rgba(255,179,71,.2);border-radius:12px}
.meter{display:grid;gap:6px}
.bar{height:14px;border-radius:999px;border:1px solid rgba(255,179,71,.3);background:rgba(255,255,255,.08);overflow:hidden}
.fill{height:100%;width:40%;background:linear-gradient(90deg,#6cf5ff,#ffb347)}
.band{height:6px;border-radius:999px;border:1px dashed rgba(255,255,255,.5);background:rgba(108,245,255,.2)}
.hold{background:#101522;border:1px solid rgba(255,179,71,.4);border-radius:12px;padding:10px 14px;text-align:center;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,4,12,.78);opacity:0;pointer-events:none;transition:opacity .2s ease;border-radius:14px}
.overlay.show{opacity:1;pointer-events:auto}
button{margin-top:10px;padding:10px 16px;border-radius:999px;border:none;background:var(--accent);color:#2a1b05;font-weight:700;cursor:pointer}
.controls{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted)}
.link{color:var(--accent);text-decoration:none}
.highscores ol{margin:0;padding-left:20px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>Thermal Reactor</h1>
      <div class="muted">Heat on press, cool on release. Stay in band.</div>
    </div>
    <div class="panel stats">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Best</span><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="panel" style="position:relative;display:grid;gap:10px">
    <canvas id="game" width="860" height="220" class="canvas" aria-label="Thermal reactor"></canvas>
    <div class="meter">
      <div>Core temperature</div>
      <div class="bar"><div class="fill" id="temp"></div></div>
      <div class="band" id="band"></div>
    </div>
    <div class="hold" id="hold">Hold or Space</div>
    <div class="overlay show" id="overlay">
      <div class="panel">
        <h2 id="ot">Stabilize the core</h2>
        <p id="otx" style="color:var(--muted)">Safe band shifts as demand rises.</p>
        <button id="start">Start</button>
      </div>
    </div>
  </div>

  <div class="panel controls">
    <span>Hold to heat, release to cool</span>
    <span><a class="link" href="../../index.html">Back to games list</a></span>
  </div>

  <div class="panel highscores">
    <h3>Top Scores</h3>
    <ol id="scores"></ol>
  </div>
</div>

<script src="../../libs/core.js"></script>
<script src="../../libs/prefs.js"></script>
<script src="../../libs/themes.js"></script>
<script src="../../libs/debug.js"></script>
<script src="../../libs/highscores.js"></script>
<script src="../../libs/ui.js"></script>
<script>
const gameId="thermal-reactor";
const c=document.getElementById("game");
const g=c.getContext("2d");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const tempEl=document.getElementById("temp");
const bandEl=document.getElementById("band");
const list=document.getElementById("scores");
const overlay=document.getElementById("overlay");
const ot=document.getElementById("ot");
const otx=document.getElementById("otx");
const start=document.getElementById("start");
const hold=document.getElementById("hold");
const s={run:false,press:false,t:0,score:0,best:0,temp:50,lo:42,hi:62,risk:0,demand:0,last:0};
HTMLGAMES.themes.applyTheme(HTMLGAMES.themes.getTheme());
function hs(){const r=HTMLGAMES.highscores.top(gameId,5);list.innerHTML="";if(!r.length){const li=document.createElement("li");li.textContent="No scores yet.";list.appendChild(li);}else{r.forEach(e=>{const li=document.createElement("li");li.textContent=`${e.score} s`;list.appendChild(li);});}s.best=r.length?r[0].score:0;bestEl.textContent=s.best;}
function reset(){s.t=0;s.score=0;s.temp=50;s.lo=42;s.hi=62;s.risk=0;s.demand=0;scoreEl.textContent=0;bars();}
function bars(){tempEl.style.width=s.temp+"%";const w=Math.max(10,s.hi-s.lo);bandEl.style.width=w+"%";bandEl.style.marginLeft=s.lo+"%";}
function update(dt){s.t+=dt;s.demand=Math.min(1,s.t/45);const heat=24+s.demand*16;const cool=20+s.demand*12;s.temp+=(s.press?heat:-cool)*dt;s.temp=Math.max(2,Math.min(98,s.temp));const ok=s.temp>=s.lo&&s.temp<=s.hi;if(ok){s.score=Math.floor(s.t*1.2);s.risk=Math.max(0,s.risk-dt*.6);}else{s.risk+=dt*.6;}if(s.temp<8||s.temp>92)s.risk+=dt*.9;if(s.t%10<dt){s.lo=38+Math.random()*10;s.hi=s.lo+14+Math.random()*8;}scoreEl.textContent=s.score;bars();if(s.risk>=2.6)end("Core instability",`Score: ${s.score} s`);}
function draw(){g.fillStyle="#05060d";g.fillRect(0,0,c.width,c.height);const y=c.height*(1-s.temp/100);g.fillStyle="rgba(255,179,71,.2)";g.fillRect(0,y,c.width,c.height-y);g.strokeStyle="rgba(108,245,255,.7)";g.lineWidth=3;g.beginPath();g.moveTo(0,y);g.lineTo(c.width,y);g.stroke();g.fillStyle="rgba(255,255,255,.75)";g.font="12px 'Trebuchet MS',sans-serif";g.fillText(`Temp: ${Math.round(s.temp)}C`,12,18);g.fillText(`Demand: ${Math.round(s.demand*100)}%`,12,36);}
function loop(ts){if(!s.run)return;const dt=Math.min(.05,(ts-s.last)/1000||.016);s.last=ts;update(dt);draw();requestAnimationFrame(loop);}
function startGame(){reset();overlay.classList.remove("show");s.run=true;s.last=performance.now();requestAnimationFrame(loop);}
function end(title,text){s.run=false;ot.textContent=title;otx.textContent=text;overlay.classList.add("show");HTMLGAMES.highscores.submit(gameId,s.score);HTMLGAMES.debug.log("Game over",{score:s.score});hs();}
function setPress(v){s.press=v;hold.style.background=v?"rgba(255,179,71,.2)":"#101522";}
hold.addEventListener("pointerdown",e=>{e.preventDefault();setPress(true);});
["pointerup","pointerleave","pointercancel"].forEach(ev=>hold.addEventListener(ev,()=>setPress(false)));
window.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();setPress(true);}if(!s.run&&e.code==="Enter")startGame();});
window.addEventListener("keyup",e=>{if(e.code==="Space")setPress(false);});
start.addEventListener("click",startGame);
hs();draw();
</script>
</body>
</html>
