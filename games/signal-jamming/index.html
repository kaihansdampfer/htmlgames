<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Signal Jamming</title>
<style>
:root{color-scheme:dark;--bg:#05070f;--panel:rgba(14,18,30,.9);--accent:#6cf5ff;--text:#e6f3ff;--muted:rgba(230,243,255,.65)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 20%,rgba(108,245,255,.2),transparent 40%),radial-gradient(circle at 80% 10%,rgba(255,143,108,.12),transparent 45%),var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",sans-serif}
.shell{width:min(94vw,900px);display:grid;gap:14px;padding:18px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center}
.panel{background:var(--panel);border:1px solid rgba(108,245,255,.25);border-radius:14px;padding:14px}
.stats{display:grid;grid-auto-flow:column;gap:10px}
.stat{min-width:120px;text-align:center}
.stat span{display:block;font-size:.7rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.stat strong{font-size:1.3rem}
.canvas{background:#070910;border:1px solid rgba(108,245,255,.2);border-radius:12px}
.bars{display:grid;gap:6px}
.bar{height:14px;border-radius:999px;border:1px solid rgba(108,245,255,.3);background:rgba(255,255,255,.08);overflow:hidden}
.fill{height:100%;width:60%;background:linear-gradient(90deg,#6cf5ff,#a17bff)}
.hold{background:#101522;border:1px solid rgba(108,245,255,.4);border-radius:12px;padding:10px 14px;text-align:center;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,4,12,.78);opacity:0;pointer-events:none;transition:opacity .2s ease;border-radius:14px}
.overlay.show{opacity:1;pointer-events:auto}
button{margin-top:10px;padding:10px 16px;border-radius:999px;border:none;background:var(--accent);color:#031018;font-weight:700;cursor:pointer}
.controls{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted)}
.link{color:var(--accent);text-decoration:none}
.highscores ol{margin:0;padding-left:20px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>Signal Jamming</h1>
      <div class="muted">Press to jam, release to recharge.</div>
    </div>
    <div class="panel stats">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Best</span><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="panel" style="position:relative;display:grid;gap:10px">
    <canvas id="game" width="860" height="220" class="canvas" aria-label="Signal jammer"></canvas>
    <div class="bars">
      <div>Jammer power</div>
      <div class="bar"><div class="fill" id="power"></div></div>
      <div>Scan intensity</div>
      <div class="bar"><div class="fill" id="scan"></div></div>
    </div>
    <div class="hold" id="hold">Hold or Space</div>
    <div class="overlay show" id="overlay">
      <div class="panel">
        <h2 id="ot">Block the scans</h2>
        <p id="otx" style="color:var(--muted)">Hold to jam incoming waves.</p>
        <button id="start">Start</button>
      </div>
    </div>
  </div>

  <div class="panel controls">
    <span>Hold to jam, release to recharge</span>
    <span><a class="link" href="../../index.html">Back to games list</a></span>
  </div>

  <div class="panel highscores">
    <h3>Top Scores</h3>
    <ol id="scores"></ol>
  </div>
</div>

<script src="../../libs/core.js"></script>
<script src="../../libs/prefs.js"></script>
<script src="../../libs/themes.js"></script>
<script src="../../libs/debug.js"></script>
<script src="../../libs/highscores.js"></script>
<script src="../../libs/ui.js"></script>
<script>
const gameId="signal-jamming";
const c=document.getElementById("game");
const g=c.getContext("2d");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const powerEl=document.getElementById("power");
const scanEl=document.getElementById("scan");
const list=document.getElementById("scores");
const overlay=document.getElementById("overlay");
const ot=document.getElementById("ot");
const otx=document.getElementById("otx");
const start=document.getElementById("start");
const hold=document.getElementById("hold");
const s={run:false,press:false,t:0,score:0,best:0,power:1,scan:0,danger:0,last:0};
HTMLGAMES.themes.applyTheme(HTMLGAMES.themes.getTheme());
function hs(){const r=HTMLGAMES.highscores.top(gameId,5);list.innerHTML="";if(!r.length){const li=document.createElement("li");li.textContent="No scores yet.";list.appendChild(li);}else{r.forEach(e=>{const li=document.createElement("li");li.textContent=`${e.score} s`;list.appendChild(li);});}s.best=r.length?r[0].score:0;bestEl.textContent=s.best;}
function reset(){s.t=0;s.score=0;s.power=1;s.scan=0;s.danger=0;scoreEl.textContent=0;bars();}
function bars(){powerEl.style.width=Math.max(0,Math.min(1,s.power))*100+"%";scanEl.style.width=Math.max(0,Math.min(1,s.scan))*100+"%";}
function update(dt){s.t+=dt;const wave=Math.sin(s.t*1.3)*.4+.6;s.scan=Math.min(1,s.scan+dt*(.25+wave*.4));if(s.press&&s.power>.05){s.power=Math.max(0,s.power-dt*.6);s.scan=Math.max(0,s.scan-dt*.9);}else{s.power=Math.min(1,s.power+dt*.35);}if(s.scan>=1&&(!s.press||s.power<=.05))s.danger+=dt*.8;else s.danger=Math.max(0,s.danger-dt*.5);s.score=Math.floor(s.t*1.1);scoreEl.textContent=s.score;bars();if(s.danger>=2.2)end("Signal breach",`Score: ${s.score} s`);}
function draw(){g.fillStyle="#05060d";g.fillRect(0,0,c.width,c.height);const sh=c.height*s.scan;g.fillStyle="rgba(108,245,255,.15)";g.fillRect(0,c.height-sh,c.width,sh);const ph=c.height*s.power;g.fillStyle="rgba(161,123,255,.25)";g.fillRect(0,c.height-ph,c.width*.2,ph);g.fillStyle="rgba(255,255,255,.75)";g.font="12px 'Trebuchet MS',sans-serif";g.fillText(`Power: ${Math.round(s.power*100)}%`,12,18);g.fillText(`Scan: ${Math.round(s.scan*100)}%`,12,36);}
function loop(ts){if(!s.run)return;const dt=Math.min(.05,(ts-s.last)/1000||.016);s.last=ts;update(dt);draw();requestAnimationFrame(loop);}
function startGame(){reset();overlay.classList.remove("show");s.run=true;s.last=performance.now();requestAnimationFrame(loop);}
function end(title,text){s.run=false;ot.textContent=title;otx.textContent=text;overlay.classList.add("show");HTMLGAMES.highscores.submit(gameId,s.score);HTMLGAMES.debug.log("Game over",{score:s.score});hs();}
function setPress(v){s.press=v;hold.style.background=v?"rgba(108,245,255,.2)":"#101522";}
hold.addEventListener("pointerdown",e=>{e.preventDefault();setPress(true);});
["pointerup","pointerleave","pointercancel"].forEach(ev=>hold.addEventListener(ev,()=>setPress(false)));
window.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();setPress(true);}if(!s.run&&e.code==="Enter")startGame();});
window.addEventListener("keyup",e=>{if(e.code==="Space")setPress(false);});
start.addEventListener("click",startGame);
hs();draw();
</script>
</body>
</html>
