<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Global Highscores</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070f;
      --panel: rgba(14, 18, 30, 0.9);
      --accent: #6cf5ff;
      --warn: #ff8f6c;
      --text: #e6f3ff;
      --muted: rgba(230, 243, 255, 0.65);
    }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px 40px;
      display: grid;
      gap: 20px;
    }
    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 18px 20px;
      border: 1px solid rgba(108, 245, 255, 0.2);
      display: grid;
      gap: 12px;
    }
    .game-card {
      border: 1px solid rgba(108, 245, 255, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .game-card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    ol {
      margin: 0;
      padding-left: 20px;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    button {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #031018;
      font-weight: 700;
      width: fit-content;
    }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <h1>Global Highscores</h1>
      <p>All stored highscores across games.</p>
      <button id="refresh">Refresh</button>
      <div id="score-list"></div>
    </div>
    <div class="panel">
      <a href="index.html">Back to tools</a>
    </div>
  </main>
  <script src="../libs/core.js"></script>
  <script src="../libs/prefs.js"></script>
  <script src="../libs/themes.js"></script>
  <script src="../libs/debug.js"></script>
  <script src="../libs/highscores.js"></script>
  <script src="../libs/ui.js"></script>
  <script>
    const scoreList = document.getElementById("score-list");
    const refreshBtn = document.getElementById("refresh");

    function renderAll() {
      const gameIds = HTMLGAMES.highscores.listGames();
      scoreList.innerHTML = "";
      if (!gameIds.length) {
        scoreList.textContent = "No highscores stored yet.";
        return;
      }
      gameIds.forEach((gameId) => {
        const card = document.createElement("div");
        card.className = "game-card";
        const title = document.createElement("h3");
        title.textContent = gameId;
        const list = document.createElement("ol");
        const scores = HTMLGAMES.highscores.top(gameId, 5);
        if (!scores.length) {
          const empty = document.createElement("li");
          empty.textContent = "No scores yet.";
          list.appendChild(empty);
        } else {
          scores.forEach((entry) => {
            const item = document.createElement("li");
            item.textContent = `${entry.score} pts`;
            list.appendChild(item);
          });
        }
        card.appendChild(title);
        card.appendChild(list);
        scoreList.appendChild(card);
      });
    }

    refreshBtn.addEventListener("click", renderAll);
    renderAll();
  </script>
</body>
</html>
