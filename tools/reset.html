<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Tool</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070f;
      --panel: rgba(14, 18, 30, 0.9);
      --accent: #6cf5ff;
      --warn: #ff8f6c;
      --text: #e6f3ff;
      --muted: rgba(230, 243, 255, 0.65);
    }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px 40px;
      display: grid;
      gap: 20px;
    }
    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 18px 20px;
      border: 1px solid rgba(108, 245, 255, 0.2);
      display: grid;
      gap: 12px;
    }
    button {
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #031018;
      font-weight: 700;
      width: fit-content;
    }
    .warn {
      background: var(--warn);
      color: #1b0a03;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <h1>Reset Tools</h1>
      <p>Clear stored preferences and highscores for all games.</p>
      <button id="reset-prefs">Reset Preferences</button>
      <button id="reset-highscores" class="warn">Reset Highscores</button>
      <p id="status"></p>
    </div>
    <div class="panel">
      <a href="index.html">Back to tools</a>
    </div>
  </main>
  <script src="../libs/core.js"></script>
  <script src="../libs/prefs.js"></script>
  <script src="../libs/themes.js"></script>
  <script src="../libs/debug.js"></script>
  <script src="../libs/highscores.js"></script>
  <script src="../libs/ui.js"></script>
  <script>
    const status = document.getElementById("status");
    const resetPrefsBtn = document.getElementById("reset-prefs");
    const resetHighscoresBtn = document.getElementById("reset-highscores");

    resetPrefsBtn.addEventListener("click", () => {
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i += 1) {
        const key = localStorage.key(i);
        if (key && key.startsWith(HTMLGAMES.prefs.prefix) && !key.startsWith(`${HTMLGAMES.prefs.prefix}hs:`)) {
          keysToRemove.push(key);
        }
      }
      keysToRemove.forEach((key) => localStorage.removeItem(key));
      status.textContent = "Preferences cleared.";
    });

    resetHighscoresBtn.addEventListener("click", () => {
      HTMLGAMES.highscores.resetAll();
      status.textContent = "Highscores cleared.";
    });
  </script>
</body>
</html>
