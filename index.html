<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HTML Games</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070f;
      --panel: rgba(14, 18, 30, 0.9);
      --accent: #6cf5ff;
      --warn: #ff8f6c;
      --text: #e6f3ff;
      --muted: rgba(230, 243, 255, 0.65);
    }
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px 40px;
      background: var(--bg);
      color: var(--text);
    }
    a {
      display: block;
      padding: 12px 16px;
      border: 1px solid rgba(108, 245, 255, 0.3);
      border-radius: 10px;
      margin: 10px 0;
      text-decoration: none;
      color: inherit;
      background: var(--panel);
    }
    a:hover {
      box-shadow: 0 6px 14px rgba(108, 245, 255, 0.15);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 20px 0;
    }
    .control {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--panel);
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(108, 245, 255, 0.2);
    }
    select,
    input[type="checkbox"] {
      accent-color: var(--accent);
    }
    .tools-link {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>HTML Games</h1>
  <p>Click a game:</p>

  <div class="controls">
    <div id="theme-control"></div>
    <div id="debug-control"></div>
    <a class="tools-link" href="./tools/index.html">Open tools</a>
    <a class="tools-link" href="./tools/highscores.html">View highscores</a>
  </div>

  <a href="./games/game1/">Game 1</a>
  <a href="./games/game2/">Game 2</a>
  <a href="./games/score-tester/">Score Tester</a>
  <a href="./games/asteroid-dodge/">Asteroid Dodge</a>
  <a href="./games/connect-four/">Connect Four Clash</a>

  <script src="./libs/core.js"></script>
  <script src="./libs/prefs.js"></script>
  <script src="./libs/themes.js"></script>
  <script src="./libs/debug.js"></script>
  <script src="./libs/highscores.js"></script>
  <script src="./libs/ui.js"></script>
  <script>
    HTMLGAMES.ui.renderThemeSelector(document.getElementById("theme-control"));
    HTMLGAMES.ui.renderDebugToggle(document.getElementById("debug-control"));
  </script>
</body>
</html>
